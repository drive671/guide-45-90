<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Téléchargement — Guide 45-90</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #0a0a0f;
  color: #e5e5e5;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 24px;
}
.container { max-width: 500px; }
.icon {
  font-size: 64px;
  margin-bottom: 20px;
}
h1 {
  font-size: 32px;
  font-weight: 900;
  color: #FF6B35;
  margin-bottom: 12px;
}
p {
  color: #888;
  font-size: 16px;
  margin-bottom: 30px;
  line-height: 1.5;
}
.btn {
  display: inline-block;
  padding: 16px 32px;
  background: #FF6B35;
  color: #fff;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  transition: all 0.2s;
}
.btn:hover { background: #e55a2b; transform: translateY(-2px); }
.manual {
  margin-top: 24px;
  font-size: 13px;
  color: #555;
}
.manual a { color: #FF6B35; }
/* Spinner */
.spinner {
  width: 50px;
  height: 50px;
  border: 3px solid rgba(255,107,53,0.2);
  border-top-color: #FF6B35;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="spinner" id="spinner"></div>
  <div id="content" style="display:none;">
    <div class="icon">✅</div>
    <h1>C'est dans ta boîte !</h1>
    <p>Le guide <strong>45-90</strong> se télécharge maintenant.<br>Si le téléchargement ne démarre pas automatiquement, clique sur le bouton ci-dessous.</p>
    <a href="guide.pdf" class="btn" download="Guide-45-90.pdf">📥 Télécharger le guide</a>
    <p class="manual">Tu peux aussi <a href="guide.pdf" target="_blank">l'ouvrir dans un nouvel onglet</a></p>
  </div>
</div>

<script>
// Déclenche le téléchargement automatiquement après 1.5s
setTimeout(function() {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  
  // Crée un lien temporaire pour forcer le téléchargement
  var link = document.createElement('a');
  link.href = 'guide.pdf';
  link.download = 'Guide-45-90.pdf';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}, 1500);
</script>
</body>
</html>
